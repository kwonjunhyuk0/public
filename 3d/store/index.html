<style>
*{margin:0;padding:0;box-sizing:border-box}

     background:#11161a;color:#e8edf1;overflow:hidden}
#cv{position:fixed;inset:0;display:block;touch-action:none}
.panel{position:fixed;background:rgba(18,24,29,.92);backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px 16px}
#ui{top:62px;left:12px;width:min(236px,calc(100vw - 24px));
    max-height:calc(100vh - 76px);overflow-y:auto;
    transition:transform .22s ease,opacity .22s ease;transform-origin:top left}
#ui.hide{transform:translateX(-118%);opacity:0;pointer-events:none}
#tog{position:fixed;top:12px;left:12px;z-index:12;width:42px;height:42px;

    display:flex;align-items:center;justify-content:center;padding:0;

#tog b{position:relative;display:block;width:17px;height:2px;background:#cfdae2;
    border-radius:2px;transition:.22s}
#tog b:before,#tog b:after{content:'';position:absolute;left:0;top:0;width:17px;height:2px;
    background:#cfdae2;border-radius:2px;transition:.22s}
#tog b:before{transform:translateY(-6px)}
#tog b:after{transform:translateY(6px)}
#tog.open b{background:transparent}
#tog.open b:before{transform:rotate(45deg)}
#tog.open b:after{transform:rotate(-45deg)}
@media(max-width:700px){#hint{display:none}
  #tip{font-size:12.5px;max-width:70vw;white-space:normal}}

h1{font-size:14px;font-weight:700;margin-bottom:2px}
.sub{font-size:10.5px;color:#7e8c98;margin-bottom:12px}
.lbl{font-size:10px;color:#7e8c98;text-transform:uppercase;letter-spacing:.6px;margin:13px 0 6px}
.row{display:flex;gap:5px;flex-wrap:wrap}
button{flex:1;min-width:60px;background:#1e2830;color:#cfdae2;border:1px solid #2e3b45;
       border-radius:7px;padding:7px 4px;font-size:11px;cursor:pointer;font-family:inherit}
button:hover{background:#27343d}
button.on{background:#2b7a94;border-color:#3fa9c9;color:#fff}
.tg{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;cursor:pointer}
.tg i{width:15px;height:15px;border:1.5px solid #46545f;border-radius:4px;flex:none;position:relative}
.tg.on i{background:#3fa9c9;border-color:#3fa9c9}
.tg.on i:after{content:'';position:absolute;left:4px;top:1px;width:4px;height:8px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}

td{padding:3px 0}
td.a{text-align:right;color:#9fb0bc}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:-1px}
#tip{position:fixed;pointer-events:none;background:#0d1216;border:1px solid #3fa9c9;
     border-radius:7px;padding:6px 10px;font-size:11.5px;display:none;z-index:9;white-space:nowrap}
#tip b{color:#6fc3df}
</style></head><body>
<canvas id="cv"></canvas>

  <h1>매장 인테리어 3D</h1>

<script>
const D = {"W":3500,"D":10360,"H":2400,"WT":150,"PT":100,"PH":2100,"UP":{"w":2980,"d":2220,"offL":140},"shell":[[140,0],[3120,0],[3120,2220],[3500,2220],[3500,10360],[0,10360],[0,2220],[140,2220]],"partitions":[{"id":"P1","x1":850,"z1":2700,"x2":3500,"z2":2700},{"id":"P2","x1":850,"z1":2700,"x2":850,"z2":2900},{"id":"P2","x1":850,"z1":3700,"x2":850,"z2":5700},{"id":"P3","x1":850,"z1":5700,"x2":3500,"z2":5700},{"id":"P4","x1":1600,"z1":1150,"x2":1600,"z2":2050},{"id":"P5","x1":1000,"z1":2050,"x2":1600,"z2":2050}],"sliders":[{"id":"SD1","x1":0,"z1":2700,"x2":850,"z2":2700,"w":850},{"id":"SD2","x1":850,"z1":2900,"x2":850,"z2":3700,"w":800},{"id":"SD3","x1":0,"z1":5700,"x2":850,"z2":5700,"w":850},{"id":"SD4","x1":1600,"z1":0,"x2":1600,"z2":1150,"w":1150},{"id":"SD5","x1":140,"z1":2050,"x2":1000,"z2":2050,"w":860}],"doorW":1060,"rooms":[{"name":"세척·소독실","use":"싱크 → 세척·소독 → 보관","pts":[[140,0],[1600,0],[1600,2050],[140,2050]],"color":"#C08C7A","dim":[1460,2050],"area":2.99},{"name":"ROOM 1","use":"수면 · 락커","pts":[[1600,0],[3120,0],[3120,2220],[3500,2220],[3500,2650],[0,2650],[0,2220],[140,2220],[140,2050],[1600,2050]],"color":"#C8A882","dim":[3500,2650],"area":5.13},{"name":"ROOM 2","use":"시술 · 샤워","pts":[[900,2750],[3500,2750],[3500,5650],[900,5650]],"color":"#C8A882","dim":[2600,2900],"area":7.54},{"name":"복도","use":"연결 동선","pts":[[0,2750],[800,2750],[800,5650],[0,5650]],"color":"#8E6238","dim":[800,2900],"area":2.32},{"name":"영업장","use":"네일 · 카운터 · 대기","pts":[[0,5750],[3500,5750],[3500,10360],[0,10360]],"color":"#E2C79C","dim":[3500,4610],"area":16.14}],"items":[{"no":1,"name":"세탁기","spec":"800 × 800","type":"washer","cx":555,"cz":500,"w":800,"d":800,"h":850,"color":"#8ED4EA","kind":"eq","room":"세척·소독실"},{"no":2,"name":"싱크대","spec":"560 × 500","type":"basin","cx":1290,"cz":420,"w":560,"d":500,"h":850,"color":"#8ED4EA","kind":"eq","room":"세척·소독실"},{"no":3,"name":"소독기 · 세척기","spec":"500 × 700","type":"cabinet","cx":1290,"cz":1620,"w":500,"d":700,"h":900,"color":"#8ED4EA","kind":"eq","room":"세척·소독실"},{"no":4,"name":"보관함","spec":"450 × 400","type":"cabinet","cx":420,"cz":1760,"w":450,"d":400,"h":1600,"color":"#8A5A2B","kind":"sf","room":"세척·소독실"},{"no":5,"name":"베드","spec":"750 × 1850","type":"bed","cx":2740,"cz":1050,"w":750,"d":1850,"h":700,"color":"#C68C4E","kind":"fx","room":"ROOM 1"},{"no":6,"name":"락커","spec":"300 × 400","type":"cabinet","cx":3330,"cz":2447,"w":300,"d":400,"h":1800,"color":"#8A5A2B","kind":"sf","room":"ROOM 1"},{"no":7,"name":"샤워부스","spec":"800 × 800","type":"shower","cx":3050,"cz":3150,"w":800,"d":800,"h":2000,"color":"#8ED4EA","kind":"eq","room":"ROOM 2"},{"no":8,"name":"서랍장","spec":"800 × 800","type":"cabinet","cx":3080,"cz":4000,"w":800,"d":800,"h":800,"color":"#8A5A2B","kind":"sf","room":"ROOM 2"},{"no":9,"name":"베드","spec":"750 × 1850","type":"bed","cx":1550,"cz":4540,"w":750,"d":1850,"h":700,"color":"#C68C4E","kind":"fx","room":"ROOM 2"},{"no":10,"name":"원형의자","spec":"Ø400","type":"stool","cx":3120,"cz":4600,"w":400,"d":400,"h":460,"color":"#C68C4E","kind":"fx","room":"ROOM 2"},{"no":11,"name":"원형탁자","spec":"Ø600","type":"rtable","cx":2900,"cz":5320,"w":600,"d":600,"h":740,"color":"#C68C4E","kind":"fx","room":"ROOM 2"},{"no":12,"name":"원형의자","spec":"Ø400","type":"stool","cx":2400,"cz":5150,"w":400,"d":400,"h":460,"color":"#C68C4E","kind":"fx","room":"ROOM 2"},{"no":13,"name":"원형의자","spec":"Ø400","type":"stool","cx":1845,"cz":5990,"w":400,"d":400,"h":460,"color":"#C68C4E","kind":"fx","room":"영업장"},{"no":14,"name":"원형의자","spec":"Ø400","type":"stool","cx":2950,"cz":5950,"w":400,"d":400,"h":460,"color":"#C68C4E","kind":"fx","room":"영업장"},{"no":15,"name":"카운터","spec":"2400 × 600","type":"desk","cx":2280,"cz":6720,"w":2400,"d":600,"h":900,"color":"#C68C4E","kind":"fx","room":"영업장"},{"no":16,"name":"세면대","spec":"600 × 600","type":"basin","cx":3170,"cz":7450,"w":600,"d":600,"h":850,"color":"#8ED4EA","kind":"eq","room":"영업장"},{"no":17,"name":"벤치","spec":"400 × 1000","type":"bench","cx":300,"cz":8440,"w":400,"d":1000,"h":450,"color":"#C68C4E","kind":"fx","room":"영업장"},{"no":18,"name":"네일데스크","spec":"400 × 800","type":"desk","cx":2510,"cz":8290,"w":400,"d":800,"h":750,"color":"#C68C4E","kind":"fx","room":"영업장"},{"no":19,"name":"네일데스크","spec":"400 × 800","type":"desk","cx":2510,"cz":9470,"w":400,"d":800,"h":750,"color":"#C68C4E","kind":"fx","room":"영업장"},{"no":20,"name":"원형의자","spec":"Ø400","type":"stool","cx":2010,"cz":8290,"w":400,"d":400,"h":460,"color":"#C68C4E","kind":"fx","room":"영업장"},{"no":21,"name":"원형의자","spec":"Ø400","type":"stool","cx":2980,"cz":8290,"w":400,"d":400,"h":460,"color":"#C68C4E","kind":"fx","room":"영업장"},{"no":22,"name":"원형의자","spec":"Ø400","type":"stool","cx":2010,"cz":9470,"w":400,"d":400,"h":460,"color":"#C68C4E","kind":"fx","room":"영업장"},{"no":23,"name":"원형의자","spec":"Ø400","type":"stool","cx":2980,"cz":9470,"w":400,"d":400,"h":460,"color":"#C68C4E","kind":"fx","room":"영업장"},{"no":24,"name":"네일선반","spec":"300 × 2000","type":"cabinet","cx":3350,"cz":8880,"w":300,"d":2000,"h":1800,"color":"#8A5A2B","kind":"sf","room":"영업장"}],"zones":[],"detectors":[[750,1760],[2400,1760],[750,3760],[2400,3760]],"sprinklers":[[750,6160],[2400,6160],[750,8460],[2400,8460]]};
const S = v => v/1000;                       // mm -> m
const PART_C = 0x6fc3df, WALL_C = 0xdfe9ee, GLASS_C = 0x9ecfe2;

/* ---------- scene ---------- */
const cv = document.getElementById('cv');
const renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x11161a);
scene.fog = new THREE.Fog(0x11161a, 26, 62);
const camera = new THREE.PerspectiveCamera(45, 1, .1, 400);

scene.add(new THREE.HemisphereLight(0xdff1ff, 0x40342a, .85));
const sun = new THREE.DirectionalLight(0xfff3e0, 1.05);
sun.position.set(6,14,6); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
const sc = sun.shadow.camera;
sc.left=-10; sc.right=10; sc.top=12; sc.bottom=-12; sc.near=.5; sc.far=45;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xbcd8ea,.35); fill.position.set(-7,8,-6); scene.add(fill);

const CX = S(D.W)/2, CZ = S(D.D)/2;          // 중심 (원점 이동용)
const world = new THREE.Group(); world.position.set(-CX,0,-CZ); scene.add(world);
const G = {walls:new THREE.Group(), part:new THREE.Group(), furn:new THREE.Group(),
           zone:new THREE.Group(), fire:new THREE.Group(), lab:new THREE.Group()};
Object.values(G).forEach(x=>world.add(x));

/* ---------- helpers ---------- */
const mat = (c,o) => new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));
const floorMat = c => new THREE.MeshLambertMaterial({color:c, side:THREE.DoubleSide});
function box(w,h,d,x,y,z,m,g,noShadow){
  const me = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), m);
  me.position.set(x,y,z);
  if(!noShadow){me.castShadow=true; me.receiveShadow=true;}
  (g||world).add(me); return me;
}
function cyl(rT,rB,h,x,y,z,m,g,seg){
  const me = new THREE.Mesh(new THREE.CylinderGeometry(rT,rB,h,seg||24), m);
  me.position.set(x,y,z); me.castShadow=true; me.receiveShadow=true;
  (g||world).add(me); return me;
}
/* 벽 한 장 (중심선 좌표, mm) */
function wall(x1,z1,x2,z2,h,t,m,grp){
  const dx=x2-x1, dz=z2-z1, len=Math.hypot(dx,dz);
  const me = new THREE.Mesh(new THREE.BoxGeometry(S(len),S(h),S(t)), m);
  me.position.set(S((x1+x2)/2), S(h)/2, S((z1+z2)/2));
  me.rotation.y = -Math.atan2(dz,dx);
  me.castShadow=true; me.receiveShadow=true; grp.add(me); return me;
}

/* ---------- 바닥 ---------- */
const shape = new THREE.Shape();
D.shell.forEach((p,i)=> i? shape.lineTo(S(p[0]),S(p[1])) : shape.moveTo(S(p[0]),S(p[1])));
const base = new THREE.Mesh(new THREE.ShapeGeometry(shape), floorMat(0x2a3138));
base.rotation.x = Math.PI/2; base.position.y = -0.012; base.receiveShadow=true; world.add(base);

D.rooms.forEach(r=>{
  const sh = new THREE.Shape();
  r.pts.forEach((p,i)=> i? sh.lineTo(S(p[0]),S(p[1])) : sh.moveTo(S(p[0]),S(p[1])));
  const f = new THREE.Mesh(new THREE.ShapeGeometry(sh), floorMat(r.color));
  f.rotation.x = Math.PI/2; f.position.y = 0; f.receiveShadow = true; world.add(f);
});

/* ---------- 외벽 (전면은 개구부라 좌우 소매벽만) ---------- */
const wm = mat(WALL_C), hw = D.WT/2;
const UPL = D.UP.offL, UPR = D.UP.offL + D.UP.w, ST = D.UP.d;
[[UPL-hw,-hw,UPR+hw,-hw],[UPR+hw,-hw,UPR+hw,ST-hw],[UPR+hw,ST-hw,D.W+hw,ST-hw],
 [D.W+hw,ST-hw,D.W+hw,D.D+hw],[-hw,D.D+hw,-hw,ST-hw],
 [-hw,ST-hw,UPL-hw,ST-hw],[UPL-hw,ST-hw,UPL-hw,-hw]
].forEach(w=> wall(w[0],w[1],w[2],w[3],D.H,D.WT,wm,G.walls));

/* 전면 창호 : FIX 유리 + 출입문 */
const glass = new THREE.MeshLambertMaterial({color:GLASS_C,transparent:true,opacity:.22});
const frameM = mat(0x5a6b76);
box(S(D.W-D.doorW), S(2180), S(60), S((D.doorW+D.W)/2), S(2180)/2, S(D.D+hw), glass, G.walls, true);
box(S(D.doorW), S(2180), S(70), S(D.doorW/2), S(2180)/2, S(D.D+hw), mat(0xa9754a), G.walls);
[[0],[D.doorW],[D.W]].forEach(v=> box(S(60),S(2180),S(90), S(v[0]), S(2180)/2, S(D.D+hw), frameM, G.walls));
box(S(D.W+120), S(220), S(90), S(D.W/2), S(2180+110), S(D.D+hw), frameM, G.walls);

/* ---------- 신설 가벽 + 슬라이딩 도어 ---------- */
const pm = mat(PART_C);
D.partitions.forEach(p=> wall(p.x1,p.z1,p.x2,p.z2,D.PH,D.PT,pm,G.part));
const sdM = new THREE.MeshLambertMaterial({color:0x3fa9c9,transparent:true,opacity:.62});
D.sliders.forEach(s=>{
  const horiz = s.z1===s.z2;
  const L=(horiz? s.x2-s.x1 : s.z2-s.z1);
  for(let i=0;i<2;i++){
    const off=(i? 1:-1)*S(D.PT)*0.55, len=S(L)*0.52;
    const g2=new THREE.Mesh(new THREE.BoxGeometry(horiz?len:S(50), S(D.PH)*0.97, horiz?S(50):len), sdM);
    const mx=S((s.x1+s.x2)/2), mz=S((s.z1+s.z2)/2);
    const shift=(i? .24:-.24)*S(L);
    g2.position.set(horiz? mx+shift : mx+off, S(D.PH)/2, horiz? mz+off : mz+shift);
    G.part.add(g2);
  }
});

/* ---------- 가구 ---------- */
const pick=[];
function reg(obj,it){ obj.traverse(o=>{ if(o.isMesh){o.userData.it=it; pick.push(o);} }); }

function build(it){
  const grp=new THREE.Group(); G.furn.add(grp);
  const w=S(it.w), d=S(it.d), h=S(it.h), x=S(it.cx), z=S(it.cz);
  const m=mat(it.color), dark=mat(new THREE.Color(it.color).multiplyScalar(.72).getHex());
  const t=it.type;
  if(t==='bed'){
    box(w,h*.32,d,x,h*.16,z,dark,grp);
    box(w*.96,h*.34,d*.88,x,h*.48,z,mat(0xf2ece2),grp);
    box(w*.9,h*.16,d*.14,x,h*.72,z-d*.36,mat(0xffffff),grp);
    box(w,h*1.1,S(60),x,h*.55,z-d/2,dark,grp);
  } else if(t==='stool'){
    cyl(w/2,w/2,h*.16,x,h*.92,z,m,grp);
    cyl(w*.09,w*.09,h*.84,x,h*.42,z,dark,grp,12);
    cyl(w*.32,w*.36,h*.05,x,h*.03,z,dark,grp);
  } else if(t==='rtable'){
    cyl(w/2,w/2,h*.08,x,h*.96,z,m,grp);
    cyl(w*.08,w*.08,h*.92,x,h*.46,z,dark,grp,12);
    cyl(w*.34,w*.38,h*.04,x,h*.02,z,dark,grp);
  } else if(t==='desk'){
    box(w,h*.09,d,x,h*.955,z,m,grp);
    [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(s=>
      box(S(50),h*.91,S(50),x+s[0]*(w/2-S(60)),h*.455,z+s[1]*(d/2-S(60)),dark,grp));
  } else if(t==='bench'){
    box(w,h*.18,d,x,h*.9,z,m,grp);
    [-1,1].forEach(s=> box(w*.85,h*.8,S(70),x,h*.4,z+s*(d/2-S(70)),dark,grp));
  } else if(t==='cabinet'){
    box(w,h,d,x,h/2,z,m,grp);
    const n=Math.max(2,Math.round(h/S(450)));
    for(let i=0;i<n;i++)
      box(w*.86,S(20),S(25),x,h*(i+.5)/n,z+d/2,dark,grp,true);
  } else if(t==='washer2'){
    for(let i=0;i<2;i++){
      box(w,h/2*.96,d,x,h/4+i*h/2,z,m,grp);
      cyl(Math.min(w,h/2)*.3,Math.min(w,h/2)*.3,S(40),x,h/4+i*h/2,z+d/2,
          new THREE.MeshLambertMaterial({color:0x2c4450,transparent:true,opacity:.75}),grp)
        .rotation.x=Math.PI/2;
    }
  } else if(t==='washer'){
    box(w,h,d,x,h/2,z,m,grp);
    cyl(Math.min(w,h)*.27,Math.min(w,h)*.27,S(40),x,h*.52,z+d/2,
        new THREE.MeshLambertMaterial({color:0x2c4450,transparent:true,opacity:.75}),grp)
      .rotation.x=Math.PI/2;
    box(w*.78,S(30),S(35),x,h*.88,z+d/2,dark,grp,true);
  } else if(t==='basin'){
    box(w,h*.75,d,x,h*.375,z,dark,grp);
    box(w,h*.08,d,x,h*.79,z,mat(0xffffff),grp);
    cyl(w*.3,w*.26,h*.12,x,h*.87,z,mat(0xffffff),grp);
    cyl(S(25),S(25),h*.2,x,h*.95,z-d*.3,mat(0xbfd2dc),grp,10);
  } else if(t==='shower'){
    box(w,S(60),d,x,S(30),z,mat(0xe8eef1),grp);
    const gm=new THREE.MeshLambertMaterial({color:0xbfe6f2,transparent:true,opacity:.24});
    box(w,h,S(35),x,h/2,z-d/2,gm,grp,true);
    box(S(35),h,d,x-w/2,h/2,z,gm,grp,true);
    box(S(35),h,d,x+w/2,h/2,z,gm,grp,true);
    cyl(S(70),S(70),S(45),x,h*.93,z-d*.25,m,grp,12);
  }
  reg(grp,it); return grp;
}
D.items.forEach(build);

/* ---------- 확보 공간 ---------- */
D.zones.forEach(z=>{
  const w=S(z.x2-z.x1), d=S(z.z2-z.z1);
  const p=new THREE.Mesh(new THREE.PlaneGeometry(w,d),
    new THREE.MeshBasicMaterial({color:0xf0629a,transparent:true,opacity:.3,side:THREE.DoubleSide}));
  p.rotation.x=Math.PI/2; p.position.set(S((z.x1+z.x2)/2),.012,S((z.z1+z.z2)/2)); G.zone.add(p);
  const e=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(w,S(900),d)),
    new THREE.LineBasicMaterial({color:0xf0629a}));
  e.position.set(S((z.x1+z.x2)/2),S(450),S((z.z1+z.z2)/2)); G.zone.add(e);
});

/* ---------- 소방 ---------- */
const dm=mat(0xf0f4f6), sm=mat(0xd94f4f);
D.detectors.forEach(p=> cyl(S(90),S(90),S(45),S(p[0]),S(D.H)-S(40),S(p[1]),dm,G.fire,14));
D.sprinklers.forEach(p=> cyl(S(45),S(70),S(70),S(p[0]),S(D.H)-S(50),S(p[1]),sm,G.fire,14));
G.fire.visible=false;

/* ---------- 실 이름 라벨 ---------- */
function label(text,sub,x,z,y){
  const c=document.createElement('canvas'); c.width=512; c.height=160;
  const t=c.getContext('2d');
  t.fillStyle='rgba(12,17,21,.82)'; t.beginPath();
  if(t.roundRect) t.roundRect(6,6,500,148,22); else t.rect(6,6,500,148);
  t.fill();
  t.textAlign='center'; t.fillStyle='#eaf3f7'; t.font='bold 60px sans-serif';
  t.fillText(text,256,72);
  t.fillStyle='#7fc6dd'; t.font='34px sans-serif'; t.fillText(sub,256,120);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),
      transparent:true, depthTest:false}));
  sp.position.set(x,y,z); sp.scale.set(1.5,.47,1); G.lab.add(sp);
}
D.rooms.forEach(r=>{
  const xs=r.pts.map(p=>p[0]), zs=r.pts.map(p=>p[1]);
  label(r.name, r.dim[0].toLocaleString()+'×'+r.dim[1].toLocaleString()+' · '+r.area+'㎡',
        S((Math.min(...xs)+Math.max(...xs))/2), S((Math.min(...zs)+Math.max(...zs))/2), 2.75);
});

/* ---------- 카메라 컨트롤 ---------- */
const tgt=new THREE.Vector3(0,1.1,0);
let rad=17, th=Math.PI*0.5, ph=Math.PI*0.30;
function apply(){
  ph=Math.max(.05,Math.min(Math.PI/2-.02,ph));
  rad=Math.max(2.2,Math.min(60,rad));
  camera.position.set(tgt.x+rad*Math.sin(ph)*Math.cos(th), tgt.y+rad*Math.cos(ph),
                      tgt.z+rad*Math.sin(ph)*Math.sin(th));
  camera.lookAt(tgt);
}
/* 화면 기준 방향 벡터 (수평면 투영)
   right   = ( sin th, 0, -cos th)   화면 오른쪽
   forward = (-cos th, 0, -sin th)   카메라 -> 대상 (화면 안쪽) */
const RS = () => 2*Math.PI/innerHeight;          // 화면 높이 1회 드래그 = 360°
const PS = () => 2*Math.tan(22.5*Math.PI/180)*rad/innerHeight;   // 1px 당 실제 거리

/* 끌면 모형이 손가락을 따라온다 (three.js OrbitControls 와 동일한 감각) */
function rotateBy(dx,dy){ th += dx*RS(); ph -= dy*RS(); apply(); }
function panBy(dx,dy){
  const s=PS(), st=Math.sin(th), ct=Math.cos(th);
  tgt.x += -s*(dx*st + dy*ct);
  tgt.z +=  s*(dx*ct - dy*st);
  apply();
}

let drag=null,px=0,py=0,nTouch=0;
cv.addEventListener('pointerdown',e=>{drag=(e.button===2||e.shiftKey)?'pan':'rot';px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{
  if(!drag || nTouch>=2) return;
  const dx=e.clientX-px, dy=e.clientY-py; px=e.clientX; py=e.clientY;
  (drag==='rot'? rotateBy : panBy)(dx,dy);
});
cv.addEventListener('wheel',e=>{e.preventDefault(); rad*=Math.pow(1.0016,e.deltaY); apply()},{passive:false});

/* 터치: 1손가락=회전(pointer 이벤트) · 2손가락=핀치 줌 + 이동 */
let pD=0, pC=null;
const tDist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
const tMid =t=>({x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2});
cv.addEventListener('touchstart',e=>{ nTouch=e.touches.length;
  if(nTouch===2){ drag=null; pD=tDist(e.touches); pC=tMid(e.touches); } },{passive:true});
cv.addEventListener('touchmove',e=>{
  if(e.touches.length!==2) return;
  e.preventDefault();
  const d=tDist(e.touches), c=tMid(e.touches);
  if(pD>0) rad=Math.max(2.2,Math.min(60,rad*pD/d));
  panBy(c.x-pC.x, c.y-pC.y);
  pD=d; pC=c;
},{passive:false});
cv.addEventListener('touchend',e=>{ nTouch=e.touches.length; if(nTouch<2) pD=0; },{passive:true});

const VIEWS={ iso:[17,Math.PI*.5,Math.PI*.30,1.1], top:[16,Math.PI*.5,.06,1.1],
              eye:[6.5,Math.PI*1.5,Math.PI*.47,1.6], ent:[9,Math.PI*.5,Math.PI*.42,1.5] };
function setView(k){ const v=VIEWS[k]; rad=v[0]; th=v[1]; ph=v[2];
  tgt.set(0, v[3], k==='eye'? 2.2 : (k==='ent'? 3.4 : 0)); apply(); }

/* ---------- UI ---------- */
const ui=document.getElementById('ui'), tog=document.getElementById('tog');
const narrow=()=> innerWidth<=700;
function setPanel(open){ ui.classList.toggle('hide',!open); tog.classList.toggle('open',open); }
tog.onclick=()=> setPanel(ui.classList.contains('hide'));
setPanel(!narrow());                      // 모바일은 접힌 상태로 시작

document.querySelectorAll('#ui button').forEach(b=> b.onclick=()=>{
  document.querySelectorAll('#ui button').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); setView(b.dataset.v);
  if(narrow()) setPanel(false); });       // 좁은 화면에선 시점 고르면 자동으로 접기
document.querySelectorAll('.tg').forEach(t=> t.onclick=()=>{
  t.classList.toggle('on'); G[t.dataset.t].visible=t.classList.contains('on'); });
const rt=document.getElementById('rt');
rt.innerHTML=D.rooms.map(r=>`<tr><td><span class="sw" style="background:${r.color}"></span>${r.name}</td>
  <td class="a">${r.area}㎡</td></tr>`).join('')
  +`<tr><td colspan="2" style="padding-top:7px;border-top:1px solid #2a343c;color:#7e8c98;font-size:10.5px">
     가벽 t100 · H2100 (천장 미접)</td></tr>`;

/* ---------- 클릭 정보 ---------- */
const ray=new THREE.Raycaster(), m2=new THREE.Vector2(), tip=document.getElementById('tip');
cv.addEventListener('click',e=>{
  m2.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(m2,camera);
  const h=ray.intersectObjects(pick,false);
  if(h.length && G.furn.visible){
    const it=h[0].object.userData.it;
    tip.innerHTML=`<b>${it.no}. ${it.name}</b> &nbsp;${it.spec} · H${it.h.toLocaleString()}<br>
      <span style="color:#8d9ba6">${it.room}</span>`;
    tip.style.display='block';
    tip.style.left=Math.min(e.clientX+14, innerWidth-230)+'px';
    tip.style.top=(e.clientY+14)+'px';
  } else tip.style.display='none';
});

function resize(){ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); }
addEventListener('resize',resize); resize(); apply();
(function loop(){ requestAnimationFrame(loop); renderer.render(scene,camera); })();
</script></body></html>
