": 2200}, {"name": "붙박이 식탁", "kind": "table", "x1": 3700, "z1": 4320, "x2": 5600, "z2": 5020, "h": 750}, {"name": "주방 카운터", "kind": "counter", "x1": 3700, "z1": 5020, "x2": 4300, "z2": 6880, "h": 850}, {"name": "주방 카운터", "kind": "counter", "x1": 4300, "z1": 6300, "x2": 6000, "z2": 6880, "h": 850}, {"name": "냉장고", "kind": "appl", "x1": 6000, "z1": 6180, "x2": 6580, "z2": 6880, "h": 1800}, {"name": "냉동고 2", "kind": "appl", "x1": 6090, "z1": 5210, "x2": 6510, "z2": 5630, "h": 850}, {"name": "신발장", "kind": "cab", "x1": 6680, "z1": 5300, "x2": 7300, "z2": 7300, "h": 2100}, {"name": "변기", "kind": "wc", "x1": 1550, "z1": 3450, "x2": 1950, "z2": 4100, "h": 750}, {"name": "세면대", "kind": "basin", "x1": 150, "z1": 3450, "x2": 650, "z2": 3850, "h": 850}, {"name": "변기", "kind": "wc", "x1": 9100, "z1": 4100, "x2": 9500, "z2": 4750, "h": 750}, {"name": "세면대", "kind": "basin", "x1": 8450, "z1": 4100, "x2": 8950, "z2": 4500, "h": 850}], "areas": {"안방": 9.54, "거실": 17.9678, "방3": 9.048, "화장실 1": 2.675, "화장실 2": 3.888, "방2": 7.4504, "주방": 8.04, "신발장": 1.74375, "현관": 2.12625, "발코니 A": 2.1976, "발코니 B": 2.80488}, "total": 67.48}, S=v=>v/1000;

const mat=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));

function box(w,h,d,x,y,z,m,g,ns){const me=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  me.position.set(x,y,z); if(!ns){me.castShadow=true;me.receiveShadow=true;} (g||world).add(me); return me;}

  me.position.set(x,y,z); me.castShadow=true; me.receiveShadow=true; (g||world).add(me); return me;}
function wall(x1,z1,x2,z2,h,t,m,grp){
  const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz); if(len<1)return;
  const me=new THREE.Mesh(new THREE.BoxGeometry(S(len),S(h),S(t)),m);
  me.position.set(S((x1+x2)/2),S(h)/2,S((z1+z2)/2));
  me.rotation.y=-Math.atan2(dz,dx); me.castShadow=true; me.receiveShadow=true; grp.add(me); return me;}

    box(w,h*.24,d,x,S(1900),z,m,g);
    for(let i=0;i<3;i++) box(w*.9,S(25),S(20),x,S(1830+i*40),z+d/2,mat(0xc8ccd0),g,true);
  } else if(k==='rack'){
    [-1,1].forEach(s=>box(S(50),h,S(50),x+s*(w/2-S(40)),h/2,z,dk,g));
    for(let i=0;i<4;i++) box(w,S(30),S(30),x,h*.55+S(i*180),z,mat(0xd0d4d8),g,true);
  } else if(k==='wc'){
    box(w*.8,h*.55,d*.55,x,h*.28,z+d*.2,m,g);
    box(w*.7,h*.45,d*.3,x,h*.62,z-d*.32,m,g);
  } else if(k==='basin'){
    box(w,h*.72,d,x,h*.36,z,mat(0xDCE6EB),g);
    box(w*.98,h*.1,d*.98,x,h*.78,z,m,g);
    cyl(S(25),S(25),S(180),x,h*.9,z-d*.3,mat(0xbfd2dc),g,10);
  } else box(w,h,d,x,h/2,z,m,g);
  g.traverse(o=>{if(o.isMesh){o.userData.f=f;pick.push(o);}});
}
D.furn.forEach(build);

/* 실 이름 스프라이트 */
function label(t1,t2,x,z,y){
  const c=document.createElement('canvas'); c.width=512;c.height=150;
  const g=c.getContext('2d');
  g.fillStyle='rgba(12,17,21,.84)';
  if(g.roundRect){g.beginPath();g.roundRect(6,6,500,138,20);g.fill();}else g.fillRect(6,6,500,138);
  g.textAlign='center'; g.fillStyle='#eaf3f7'; g.font='bold 58px sans-serif'; g.fillText(t1,256,68);
  g.fillStyle='#7fc6dd'; g.font='32px sans-serif'; g.fillText(t2,256,116);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  sp.position.set(x,y,z); sp.scale.set(1.45,.42,1); G_.lab.add(sp);
}
D.rooms.concat(D.balcony.map(b=>({name:b.name,x1:b.x1,z1:b.z1,x2:b.x2,z2:b.z2,area:b.area})))
 .forEach(r=>{const ar=D.areas[r.name]!==undefined?D.areas[r.name]:r.area;
   label(r.name,ar.toFixed(2)+'㎡ · '+(ar/3.3058).toFixed(2)+'평',
     S((r.x1+r.x2)/2),S((r.z1+r.z2)/2),2.72);});

/* 카메라 */
const tgt=new THREE.Vector3(0,1.1,0); let rad=15,th=Math.PI*.5,ph=Math.PI*.30;
function apply(){ph=Math.max(.05,Math.min(Math.PI/2-.02,ph)); rad=Math.max(2,Math.min(55,rad));
  camera.position.set(tgt.x+rad*Math.sin(ph)*Math.cos(th),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.sin(th));
  camera.lookAt(tgt);}
const RS=()=>2*Math.PI/innerHeight, PS=()=>2*Math.tan(22.5*Math.PI/180)*rad/innerHeight;
function rotateBy(dx,dy){th+=dx*RS(); ph-=dy*RS(); apply();}
function panBy(dx,dy){const s=PS(),st=Math.sin(th),ct=Math.cos(th);
  tgt.x+=-s*(dx*st+dy*ct); tgt.z+=s*(dx*ct-dy*st); apply();}
let drag=null,px=0,py=0,nT=0,pD=0,pC=null;
cv.addEventListener('pointerdown',e=>{drag=(e.button===2||e.shiftKey)?'pan':'rot';px=e.clientX;py=e.clientY;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointerup',()=>drag=null);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{if(!drag||nT>=2)return;
  const dx=e.clientX-px,dy=e.clientY-py;px=e.clientX;py=e.clientY;(drag==='rot'?rotateBy:panBy)(dx,dy);});
cv.addEventListener('wheel',e=>{e.preventDefault();rad*=Math.pow(1.0016,e.deltaY);apply()},{passive:false});
const tD=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
const tM=t=>({x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2});
cv.addEventListener('touchstart',e=>{nT=e.touches.length;if(nT===2){drag=null;pD=tD(e.touches);pC=tM(e.touches);}},{passive:true});
cv.addEventListener('touchmove',e=>{if(e.touches.length!==2)return;e.preventDefault();
  const d=tD(e.touches),c=tM(e.touches); if(pD>0)rad=Math.max(2,Math.min(55,rad*pD/d));
  panBy(c.x-pC.x,c.y-pC.y); pD=d;pC=c;},{passive:false});
cv.addEventListener('touchend',e=>{nT=e.touches.length;if(nT<2)pD=0;},{passive:true});
const VIEWS={iso:[15,Math.PI*.5,Math.PI*.30,1.1,0],top:[14,Math.PI*.5,.06,1.1,0],
             eye:[6,Math.PI*1.5,Math.PI*.47,1.6,1.6],ent:[8,Math.PI*.42,Math.PI*.40,1.5,2.4]};
function setView(k){const v=VIEWS[k];rad=v[0];th=v[1];ph=v[2];tgt.set(0,v[3],v[4]);apply();}

const ui=document.getElementById('ui'),tog=document.getElementById('tog');
const narrow=()=>innerWidth<=700;
function setPanel(o){ui.classList.toggle('hide',!o);tog.classList.toggle('open',o);}
tog.onclick=()=>setPanel(ui.classList.contains('hide')); setPanel(!narrow());
document.querySelectorAll('#ui button.v').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#ui button.v').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); setView(b.dataset.v); if(narrow())setPanel(false);});
document.querySelectorAll('.tg').forEach(t=>t.onclick=()=>{t.classList.toggle('on');
  G_[t.dataset.t].visible=t.classList.contains('on');});
const SWC={room:'#C9A87C',liv:'#D9BE96',wet:'#B9C7CE',kit:'#C2A783',util:'#A98F72'};
document.getElementById('rt').innerHTML=
  D.rooms.map(r=>`<tr><td><span class="sw" style="background:${SWC[r.kind]}"></span>${r.name}</td><td class="a">${D.areas[r.name].toFixed(2)}㎡</td></tr>`).join('')
 +D.balcony.map(b=>`<tr><td><span class="sw" style="background:#9FB4BC"></span>${b.name}</td><td class="a">${b.area.toFixed(2)}㎡</td></tr>`).join('')
 +`<tr><td colspan="2" style="padding-top:7px;border-top:1px solid #2a343c;color:#7e8c98;font-size:10.5px">전용 ${D.total}㎡ · 가구 ${D.furn.length}점</td></tr>`;

const ray=new THREE.Raycaster(),m2=new THREE.Vector2(),tip=document.getElementById('tip');
cv.addEventListener('click',e=>{
  m2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(m2,camera);
  const h=ray.intersectObjects(pick,false);
  if(h.length&&G_.furn.visible){const f=h[0].object.userData.f;
    tip.innerHTML=`<b>${f.name}</b><br><span style="color:#8d9ba6">${(f.x2-f.x1).toLocaleString()} × ${(f.z2-f.z1).toLocaleString()} × H${f.h.toLocaleString()}</span>`;
    tip.style.display='block'; tip.style.left=Math.min(e.clientX+14,innerWidth-210)+'px';
    tip.style.top=(e.clientY+14)+'px';
  } else tip.style.display='none';});
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}
addEventListener('resize',resize); resize(); apply();
(function loop(){requestAnimationFrame(loop);renderer.render(scene,camera);})();
